[project]
name = "retenciones"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.102.0",
    "cryptography>=48.0.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pymysql>=1.1.3",
    "pytest>=9.0.3",
    "pytest-html>=4.0",
    "pytz>=2026.2",
    "rapidfuzz>=3.14.5",
    "spacy>=3.8.14",
    "sqlalchemy>=2.0.49",
]
[tool.uv]
package = true

[project.scripts]
retenciones = "asignacion_retenciones.main_automatizacion_impositivas:automatizar_impositivas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
addopts = "-v --html=reports/reporte_tests.html --self-contained-html"
markers = [
    "unit: tests sin dependencia de base de datos",
    "integration: requieren conexión real a la base de datos",
]

